<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>RPG Table</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="error" hidden></div>

  <!-- Dice result overlay -->
  <div id="roll-result" hidden>
    <div class="roll-total"></div>
    <div class="roll-detail"></div>
  </div>

  <!-- Controls (tap the screen to show / hide) -->
  <div id="ui">
    <header class="bar">
      <button id="btn-prev" aria-label="Poprzednia scena">‹</button>
      <select id="scene-select" aria-label="Scena"></select>
      <button id="btn-next" aria-label="Następna scena">›</button>
      <button id="btn-fullscreen" aria-label="Pełny ekran">⛶</button>
    </header>

    <section class="bar intensity">
      <label for="intensity">Intensywność</label>
      <input id="intensity" type="range" min="0" max="2" step="0.01" value="1">
    </section>

    <section id="dice" class="panel">
      <div class="dice-buttons">
        <button data-roll="1d4">d4</button>
        <button data-roll="1d6">d6</button>
        <button data-roll="1d8">d8</button>
        <button data-roll="1d10">d10</button>
        <button data-roll="1d12">d12</button>
        <button data-roll="1d20">d20</button>
        <button data-roll="1d100">d100</button>
        <button data-roll="2d20kh1">Przewaga</button>
        <button data-roll="2d20kl1">Utrudnienie</button>
        <button data-roll="4d6kh3">Cecha</button>
      </div>
      <form id="dice-form" autocomplete="off">
        <input id="dice-input" type="text" inputmode="text" placeholder="np. 2d6+3, 8d6, 2d20kh1+5" spellcheck="false">
        <button type="submit">Rzuć</button>
      </form>
      <ol id="dice-history"></ol>
    </section>
  </div>

  <script src="dice.js"></script>
  <script src="renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
