name: Deploy to GitHub Pages

# Deploys only on demand (milestones): gh workflow run pages.yml
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate scenes.json and referenced files
        run: |
          python3 - <<'EOF'
          import json, os, sys
          scenes = json.load(open('scenes.json'))['scenes']
          missing = [p for s in scenes for p in (s.get('shader'), s.get('image')) if p and not os.path.exists(p)]
          ids = [s['id'] for s in scenes]
          if missing: sys.exit('Missing files: ' + ', '.join(missing))
          if len(ids) != len(set(ids)): sys.exit('Duplicate scene ids')
          print(f'{len(scenes)} scenes OK')
          EOF

      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html style.css app.js dice.js renderer.js service-worker.js manifest.json scenes.json shaders images icons fonts _site/
          # Bust the service worker cache on every deploy.
          sed -i "s/rpg-table-v1/rpg-table-${GITHUB_SHA::8}/" _site/service-worker.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job: deploy-pages right after the upload in the same job sometimes
  # failed with "No artifacts named github-pages" (artifact list not yet updated).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
